services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - app/orchestrator/.env
    volumes:
      - hf-cache:/root/.cache/huggingface
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf-cache:
