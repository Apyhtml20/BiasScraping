<app-url-input />

<div class="results-shell">
  @if (api.loading()) {
    <app-audit-progress />
  } @else if (api.report(); as report) {
    <div class="results">
      <app-score-card [report]="report" />

      <div class="results-grid">
        <app-nlp-results [issues]="report.issues" />
        <app-vision-results [images]="report.images" [representation]="report.representation" />
      </div>

      @if (report.agent_analysis) {
        <section class="panel analysis-panel">
          <header class="panel-header">
            <h3>AI orchestrator summary</h3>
          </header>
          <div class="analysis-body" [innerHTML]="report.agent_analysis | markdown"></div>
        </section>
      }

      @if (report.world_model) {
        <app-world-model [worldModel]="report.world_model" />
      }

      <app-recommendations [recommendations]="report.recommendations" />
    </div>
  }
</div>
